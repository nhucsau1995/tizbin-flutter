<!-- Interactive Demo Feedback Script -->
<script>
    function selectOption(buttonElement) {
      // Visual feedback on tap
      const allButtons = document.querySelectorAll('.option-btn');
      allButtons.forEach(btn => {
        btn.classList.remove('ring-2', 'ring-accent-fill', 'bg-accent-tint');
      });
      
      buttonElement.classList.add('ring-2', 'ring-accent-fill', 'bg-accent-tint');
      
      // Gentle feedback trigger
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(30);
      }
    }
