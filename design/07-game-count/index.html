<style>

<body class="bg-background min-h-screen flex justify-center items-start text-text-primary antialiased selection:bg-accent-tint">
<!-- Mobile Simulator Frame (393px typical layout, safe padded) -->
<main class="w-full max-w-[393px] min-h-screen bg-background flex flex-col justify-between px-5 pt-3 pb-8 relative overflow-hidden">
<!-- Top Bar & Progress Section -->
<header class="w-full flex flex-col gap-3.5">
<!-- Status Meta Bar -->
<div class="flex items-center justify-between pt-2">
<!-- Right side (RTL first): Exit icon and Challenge round counter -->
<div class="flex items-center gap-2">
<button aria-label="خروج از بازی" class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-alt text-text-secondary active:scale-90 transition-transform" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
<div class="inline-flex items-center px-3 py-1 rounded-full bg-surface-container-lowest border border-divider">
<span class="text-caption font-caption text-text-primary">۷ از ۱۵</span>
</div>
</div>
<!-- Center: Circular Countdown Timer -->
<div class="relative flex flex-col items-center justify-center -my-2">
<svg class="w-[72px] h-[72px] transform -rotate-90" viewbox="0 0 76 76">
<!-- Background track circle -->
<circle cx="38" cy="38" fill="none" r="34" stroke="#E8F5E8" stroke-width="5"></circle>
<!-- Active progress circle -->
<circle class="timer-ring-circle" cx="38" cy="38" fill="none" r="34" stroke="#0F770F" stroke-linecap="round" stroke-width="5"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none pt-0.5">
<span class="text-title font-title text-accent-fill leading-none">۵۱</span>
<span class="text-[10px] font-caption text-text-secondary leading-none mt-0.5">ثانیه</span>
</div>
</div>
<!-- Left side: Score chip -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-accent-tint text-accent-fill">
<span class="text-label font-label">۷۳۵</span>
<span class="material-symbols-outlined text-[16px] text-banana-yellow" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
<!-- 15-Segment Level Progress Bar -->
<div class="w-full grid grid-cols-15 gap-1 pt-1" style="grid-template-columns: repeat(15, minmax(0, 1fr));">
<!-- 6 Completed Segments -->
<div class="h-1.5 rounded-full bg-accent-fill"></div>
<div class="h-1.5 rounded-full bg-accent-fill"></div>
<div class="h-1.5 rounded-full bg-accent-fill"></div>
<div class="h-1.5 rounded-full bg-accent-fill"></div>
<div class="h-1.5 rounded-full bg-accent-fill"></div>
<div class="h-1.5 rounded-full bg-accent-fill"></div>
<!-- 9 Remaining Segments -->
<div class="h-1.5 rounded-full bg-surface-alt"></div>
<div class="h-1.5 rounded-full bg-surface-alt"></div>
<div class="h-1.5 rounded-full bg-surface-alt"></div>
<div class="h-1.5 rounded-full bg-surface-alt"></div>
<div class="h-1.5 rounded-full bg-surface-alt"></div>

<div class="h-1.5 rounded-full bg-surface-alt"></div>
<div class="h-1.5 rounded-full bg-surface-alt"></div>
<div class="h-1.5 rounded-full bg-surface-alt"></div>
</div>
</header>
<!-- Prompt / Instruction Text -->
<section class="text-center my-3">
<div class="inline-flex items-center justify-center gap-2 mb-1">
<span class="material-symbols-outlined text-banana-yellow text-[22px]" style="font-variation-settings: 'FILL' 1;">star</span>

</svg>

</section>
<!-- 2x2 Answer Grid Options -->
<section class="w-full my-3">
<div class="grid grid-cols-2 gap-3">
<!-- Option 4 -->
<button class="h-[72px] bg-surface-container-lowest border-[1.5px] border-control-border rounded-2xl flex items-center justify-center soft-card-shadow active:scale-95 active:bg-accent-tint active:border-accent-fill transition-all duration-150" type="button">
<span class="text-display font-display text-text-primary">۴</span>
</button>
<!-- Option 5 -->
<button class="h-[72px] bg-surface-container-lowest border-[1.5px] border-control-border rounded-2xl flex items-center justify-center soft-card-shadow active:scale-95 active:bg-accent-tint active:border-accent-fill transition-all duration-150" type="button">
<span class="text-display font-display text-text-primary">۵</span>
</button>

</button>

<span class="text-display font-display text-text-primary">۷</span>
</button>

<!-- Bottom Helper and Boost Controls -->
<footer class="w-full flex items-center justify-between pt-1">
<!-- Hint helper button -->
<button class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-surface-container-lowest border border-divider text-text-secondary active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[18px] text-banana-yellow" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
<span class="text-label font-label">راهنما (۲)</span>
</button>
<!-- Multiplier Streak Indicator -->
<div class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-warning-bg text-warning-text border border-[#F5E2C7]">
<span class="material-symbols-outlined text-[18px] text-orange" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="text-caption font-caption font-bold">ضریب سرعت فعال است</span>
</div>

<script>
    // Lightweight audio/haptic simulation for answer interactions
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        if ('vibrate' in navigator) {
          navigator.vibrate(20);
        }
      });
    });
  </script>
