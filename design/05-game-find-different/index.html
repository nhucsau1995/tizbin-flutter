<!-- Inline Interaction for Polish -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const targetTile = document.getElementById('targetTile');
      const allButtons = document.querySelectorAll('#gameGrid button');

      allButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          if (btn === targetTile) {
            // Correct Answer state
            btn.classList.add('bg-success-bg', 'border-accent-fill', 'scale-105');
            setTimeout(() => {
              btn.classList.remove('scale-105');
            }, 300);
          } else {
            // Wrong Answer State
            btn.classList.add('bg-danger-bg', 'border-danger-text', 'shake');
            setTimeout(() => {
              btn.classList.remove('bg-danger-bg', 'border-danger-text', 'shake');
            }, 400);
          }
        });
      });
    });
