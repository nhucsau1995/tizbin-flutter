<body class="bg-background text-text-primary antialiased flex justify-center min-h-screen">
<!-- Mobile Frame (393px width fixed viewport) -->
<main class="w-full max-w-[393px] min-h-screen bg-background flex flex-col justify-between px-5 pt-12 pb-8 relative overflow-hidden">
<!-- Top Bar with Safe Padding and Dismiss Action -->
<header class="w-full flex items-center justify-between z-10 pt-2 mb-3">
<!-- Title Indicator / Contest Tag -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-accent-tint">
<span class="w-2 h-2 rounded-full bg-accent-fill inline-block"></span>
<span class="font-label text-caption text-text-secondary">پایان مسابقه روزانه</span>
</div>
<!-- Close Button (Top Left in RTL) -->
<button aria-label="بستن صفحه نتیجه" class="w-10 h-10 rounded-full bg-surface-container-lowest border border-divider text-text-primary flex items-center justify-center transition-all duration-150 active:scale-90 hover:bg-accent-tint focus:outline-none focus:ring-2 focus:ring-accent-fill" onclick="window.history.back()" type="button">
<span class="material-symbols-outlined text-[20px] leading-none" data-icon="close">close</span>
</button>
</header>
<!-- Hero Focal Area -->
<section class="flex flex-col items-center text-center my-auto">
<!-- Greeting Header & Cheer Badge -->
<div class="space-y-1 mb-5">
<h1 class="font-display text-display text-text-primary tracking-tight">
          آفرین سارا!
        </h1>
<p class="font-body text-caption text-text-secondary font-medium">
          یک دور شگفت‌انگیز را با دقت کامل به پایان رساندی
        </p>
</div>
<!-- Focal Big Circular Score Badge (200px) -->
<div class="relative flex items-center justify-center mb-4">
<!-- Ambient decorative pulse ring -->
<div class="absolute -inset-2.5 rounded-full bg-accent-tint opacity-70"></div>
<!-- Main Circular Gradient Badge -->
<div class="relative w-[200px] h-[200px] rounded-full bg-gradient-to-b from-accent-fill to-accent-pressed flex flex-col items-center justify-center text-on-primary custom-shadow-badge border-4 border-surface-container-lowest">
<span class="font-label text-caption text-on-primary-container tracking-wider opacity-90 mb-0.5">
            امتیاز کل
          </span>
<span class="font-display text-[44px] leading-tight font-extrabold text-on-primary drop-shadow-sm tracking-tight">
            ۱٬۲۴۰
          </span>
<div class="mt-1 px-3 py-0.5 rounded-full bg-black/10 backdrop-blur-xs">
<span class="font-caption text-caption text-on-primary/90 font-medium">
              از ۱٬۵۹۰
            </span>
</div>
</div>
</div>
<!-- Trophy Ranking Chip -->
<div class="inline-flex items-center gap-1.5 h-8 px-4 rounded-full bg-accent-tint text-accent-fill border border-divider/60 transition-transform hover:scale-105">
<span class="text-base leading-none select-none">🏆</span>
<span class="font-label text-label font-bold text-accent-fill">
          رتبه امروز: ۱۸
        </span>
</div>
</section>
<!-- Stats & Confirmation Section -->
<div class="w-full space-y-4 my-2">
<!-- 3-Column Performance Bento Cards -->
<div class="grid grid-cols-3 gap-2.5 w-full">

<span class="material-symbols-outlined text-[18px]" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="font-caption text-caption text-text-secondary block mb-0.5">درست</span>
<span class="font-title text-[17px] font-bold text-text-primary">۱۲ از ۱۵</span>
</div>

<div class="bg-surface-container-lowest rounded-[20px] p-3 text-center border border-divider custom-shadow-card flex flex-col items-center justify-center">

</div>

</div>
</div>

<button class="w-full h-14 bg-accent-fill hover:bg-accent-pressed active:bg-accent-pressed text-on-primary rounded-full font-label text-body font-bold flex items-center justify-center gap-2 transition-all duration-150 active:scale-[0.98] shadow-sm focus:outline-none focus:ring-4 focus:ring-primary-fixed" id="shareBtn" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="share">share</span>

</button>

<p class="font-caption text-caption text-text-secondary text-center font-medium">
          مسابقه بعدی فردا ساعت ۰۰:۰۰
        </p>
</div>

</main>
<!-- Interactive Feedback Script -->
<script>
    document.getElementById('shareBtn')?.addEventListener('click', async () => {
      const shareData = {
        title: 'تیزبین - مسابقه روزانه',
        text: 'من در مسابقه روزانه تیزبین امتیاز ۱٬۲۴۰ گرفتم و رتبه ۱۸ شدم! بیا رقابت کنیم.',
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (err) {
          // User dismissed share dialog
        }
      } else {
        // Fallback clipboard notification
        const originalText = document.getElementById('shareBtn').innerHTML;
        document.getElementById('shareBtn').innerHTML = `
          <span class="material-symbols-outlined text-[20px]" data-icon="done">done</span>
          <span>لینک کپی شد!</span>
        `;
        setTimeout(() => {
          document.getElementById('shareBtn').innerHTML = originalText;
        }, 2000);
      }
    });
  </script>
