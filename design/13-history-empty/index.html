<style>
    body {

      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .material-symbols-outlined {

      vertical-align: middle;
      line-height: 1;

<body class="bg-background text-text-primary antialiased min-h-screen flex justify-center items-start selection:bg-accent-tint">
<!-- Mobile Simulator Frame (393px width fixed viewport context) -->
<main class="w-full max-w-[393px] min-h-screen bg-background relative flex flex-col justify-between overflow-x-hidden pb-28">
<!-- Header Section -->
<header class="w-full px-5 pt-12 pb-4 flex items-center justify-between z-10">
<!-- Screen Title (Right-aligned in RTL) -->
<div>
<h1 class="font-display text-display text-text-primary tracking-tight">تاریخچه</h1>
</div>
<!-- User Points Chip (Left-aligned in RTL) -->
<div class="h-8 px-3.5 bg-accent-tint text-accent-fill rounded-full flex items-center justify-center gap-1.5 soft-card-shadow">
<span class="material-symbols-outlined text-[18px] text-accent-fill" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-label text-label font-bold text-accent-fill pt-0.5">۰ امتیاز</span>
</div>
</header>
<!-- Empty State Content Canvas -->
<section class="flex-1 flex flex-col items-center justify-center px-5 py-4 w-full">
<!-- Focal Element: Photograph Container -->
<div class="w-[260px] h-[260px] bg-surface-container-lowest rounded-[20px] p-2 soft-card-shadow border border-divider/40 flex items-center justify-center relative overflow-hidden transition-transform duration-300 hover:scale-[1.01]">
<img alt="عکس چای صبحگاهی و تلفن همراه روی میز چوبی" class="w-full h-full object-cover rounded-[16px]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCArTAR8ktWZVlmDs_DZxla3AY2Cyo2rzFS1E6qpnaUJBDH3rUT33YIycmoHEHyLpMsbxCZvMpQAIhLiuSf51QWd1V1LocKju2btgBPjO1Ds4DqBmWEU8BFaYmq9aAkom5BObY9gul9FFzpR--fTg2ApnkZ3U7CHVYK2pRQNGPUiUzJ8_0A7qc1lmDLnGJhVhgrRK-A-bPAOI1QzsbmzqTp9cH-06o1_-thiBLHSsakF42boEnGgSJhQrPTV6rYhM28qllj8GzNfOSv6A"/>
<div class="absolute inset-0 rounded-[20px] ring-1 ring-inset ring-black/5 pointer-events-none"></div>
</div>
<!-- Text Grouping -->
<div class="mt-6 text-center">
<h2 class="font-title text-title text-text-primary font-bold">
          هنوز بازی نکرده‌ای
        </h2>
<p class="font-body text-body text-text-secondary mt-2 max-w-[280px] mx-auto text-center leading-relaxed">
          اولین مسابقه روزانه را شروع کن تا امتیازهایت اینجا ثبت شود
        </p>
</div>
<!-- Primary Action Button -->
<button class="w-[320px] h-[56px] bg-accent-fill hover:bg-accent-pressed active:scale-95 text-white rounded-full font-label text-[15px] font-semibold flex items-center justify-center gap-2 mt-8 shadow-sm transition-all duration-150 cursor-pointer focus:outline-none focus:ring-4 focus:ring-accent-tint" type="button">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span>شروع بازی</span>
</button>
</section>
<!-- Bottom Navigation Bar (Docked fixed bottom-0, RTL order: خانه, رتبه‌ها, تاریخچه, پروفایل) -->
<nav aria-label="ناوبری اصلی" class="fixed bottom-0 right-0 left-0 max-w-[393px] mx-auto bg-surface-container-lowest border-t border-divider px-4 pb-8 pt-2.5 z-50 tab-bar-shadow flex justify-around items-center">
<!-- Tab 1: خانه (Home) -->
<button class="flex flex-col items-center justify-center text-text-secondary px-3 py-1.5 rounded-full hover:text-primary active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-[24px]">home</span>
<span class="font-caption text-caption mt-0.5">خانه</span>
</button>
<!-- Tab 2: رتبه‌ها (Leaderboard) -->
<button class="flex flex-col items-center justify-center text-text-secondary px-3 py-1.5 rounded-full hover:text-primary active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-[24px]">leaderboard</span>
<span class="font-caption text-caption mt-0.5">رتبه‌ها</span>
</button>

<button class="flex flex-col items-center justify-center bg-accent-tint text-primary font-bold rounded-full px-4 py-1.5 active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">history</span>
<span class="font-caption text-caption mt-0.5">تاریخچه</span>
</button>

<button class="flex flex-col items-center justify-center text-text-secondary px-3 py-1.5 rounded-full hover:text-primary active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-[24px]">person</span>
<span class="font-caption text-caption mt-0.5">پروفایل</span>
</button>
